[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-extract"
version = "0.1.0"
description = "Turn a pile of invoices and receipts into clean structured data (JSON + CSV), with the maths checked before anyone trusts it."
authors = [{name = "Al Amin Bashir Afara", email = "aminafara123@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11,<1",
    "pydantic>=2,<3",
    "requests>=2.31,<3",
]

[project.scripts]
doc-extract = "doc_extract.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["doc_extract"]
